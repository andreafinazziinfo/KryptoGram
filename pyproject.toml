[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kryptogram"
version = "1.0.0"
description = "KryptoGram: Sovereign Post-Quantum Cryptographic Envelope & Keyed Phonetic Conlang"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Andrea Finazzi"}]
keywords = ["cryptography", "phonetic", "conlang", "post-quantum", "kyber", "xchacha20", "kryptogram"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "PyNaCl>=1.5.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.88.0",
    "mypy>=1.5.0",
    "ruff>=0.0.290",
]

[project.scripts]
kryptogram = "kryptogram:main"
nexa-s = "kryptogram:main"
nexa-gui = "gui_nexa:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["nexa*", "kryptogram*"]
