[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa-s"
version = "1.3.0"
description = "NEXA-S: Symbolic Phonetic Alphabet + Modern Cryptography"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Andrea Finazzi"}]
keywords = ["cryptography", "phonetic", "alphabet", "security", "xchacha20"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "PyNaCl>=1.5.0",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.88.0",
    "mypy>=1.5.0",
    "ruff>=0.0.290",
    "black>=23.7.0",
]

[project.scripts]
nexa-encrypt = "nexa_encrypt:main"
nexa-gui = "gui_nexa:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexa*"]
